<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121214">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pedidos">
    <meta name="description" content="App de Pedidos de Mc-LarenS: órdenes de compra a proveedores.">
    <title>App de Pedidos</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="splash" class="overlay" role="status" aria-live="polite" aria-label="Cargando la App de Pedidos">
      <div class="panel">
        <picture>
          <source type="image/webp" srcset="./img/mclarens-logo.webp">
          <img class="brand-logo" src="./img/mclarens-logo.png" width="600" height="85" alt="Mc-LarenS">
        </picture>
        <div class="mcls-spinner" aria-hidden="true">
          <svg viewBox="0 0 606 144" aria-hidden="true">
            <polygon class="mcls-bar" points="193,0 247,0 58,143 4,143"/>
            <polygon class="mcls-bar mcls-b2" points="261,0 299,0 110,143 72,143"/>
            <polygon class="mcls-bar mcls-b3" points="313,0 339,0 150,143 124,143"/>
            <polygon class="mcls-bar mcls-b4" points="353,0 369,0 180,143 164,143"/>
            <polygon class="mcls-m" points="383,0 438,0 439,62 442,74 537,1 598,0 598,141 521,141 521,81 517,77 451,133 440,140 363,142 361,80 357,77 283,138 273,141 210,141 194,143 195,140 367,8 378,1 382,1"/>
          </svg>
        </div>
        <div class="actions">
          <button id="install-btn" class="btn-primary is-hidden" type="button">Instalar app</button>
        </div>
      </div>
    </div>

    <div id="error-screen" class="overlay is-hidden" role="alert">
      <div class="panel">
        <picture>
          <source type="image/webp" srcset="./img/mclarens-logo.webp">
          <img class="brand-logo" src="./img/mclarens-logo.png" width="600" height="85" alt="Mc-LarenS">
        </picture>
        <h1 class="splash-title">Sin conexión</h1>
        <p id="error-copy" class="error-copy">
          No se pudo cargar la App de Pedidos. Revisá tu internet e intentá de nuevo.
        </p>
        <div class="actions">
          <button id="retry-btn" class="btn-primary" type="button">Reintentar</button>
          <a class="btn" data-open-app href="#" target="_blank" rel="noopener noreferrer">Abrir en el navegador</a>
          <button id="install-btn-error" class="is-hidden" type="button">Instalar app</button>
        </div>
      </div>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
